# Transform process metadata.
#
# Rules not listed here are treated as generated by default. This file only
# describes rules that need explicit process handling.

rules:
  Program:
    mode: excluded

  TopLevelStatement:
    mode: excluded

  Statement:
    mode: excluded

  PivotStatement:
    mode: manual
    prepare: PreparePivotStatementTransform
    reduce: ReducePivotStatementTransform

  UnpivotStatement:
    mode: manual
    prepare: PrepareUnpivotStatementTransform
    reduce: ReduceUnpivotStatementTransform

  Expression:
    mode: forward

  InsertByNameOrder:
    mode: forward

  InsertByPositionOrder:
    mode: forward

  UpdateMatchSetClause:
    mode: forward

  LiteralExpression:
    mode: manual
    prepare: PrepareLiteralExpressionTransform
    reduce: ReduceLiteralExpressionTransform

  PrefixExpression:
    mode: manual
    prepare: PreparePrefixExpressionTransform
    reduce: ReducePrefixExpressionTransform

  OverClause:
    mode: manual
    prepare: PrepareOverClauseTransform
    reduce: ReduceOverClauseTransform

  SelectStatementInternal:
    mode: manual
    prepare: PrepareSelectStatementInternalTransform
    reduce: ReduceSelectStatementInternalTransform

  SimpleSelect:
    mode: manual
    prepare: PrepareSimpleSelectTransform
    reduce: ReduceSimpleSelectTransform

  TableRef:
    mode: manual
    prepare: PrepareTableRefTransform
    reduce: ReduceTableRefTransform

  WithClause:
    mode: manual
    prepare: PrepareWithClauseTransform
    reduce: ReduceWithClauseTransform

  WindowDefinition:
    mode: manual
    prepare: PrepareWindowDefinitionTransform
    reduce: ReduceWindowDefinitionTransform
